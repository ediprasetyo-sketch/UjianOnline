name: PHP Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Shell script syntax audit
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/production-repair.sh
          if [ -f tools/production-doctor.sh ]; then bash -n tools/production-doctor.sh; fi

      - name: Required production files
        shell: bash
        run: |
          set -euo pipefail
          for f in VERSION.txt update-manifest.json index.php login.php logout.php config.php admin/index.php admin/update.php admin/participants.php peserta/index.php peserta/access.php; do
            test -f "$f"
          done

      - name: Version and manifest audit
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION.txt)"
          manifest="$(php -r '$d=json_decode(file_get_contents("update-manifest.json"), true); echo $d["version"] ?? "";')"
          test "$version" = "$manifest"
          echo "VERSION=$version"

      - name: PHP syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Runtime path audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.php' '/volume1/web/ujian-online' . --exclude-dir=.git --exclude-dir=storage --exclude-dir=release --exclude-dir=releases; then
            echo 'Hard-coded production filesystem path found.'
            exit 1
          fi
          for f in ./*.php; do
            [ -f "$f" ] || continue
            if grep -nE 'require(_once)?[[:space:]]+__DIR__[[:space:]]*\.[[:space:]]*["'\''\.\./config\.php["'\'']' "$f" >/dev/null 2>&1; then
              echo "Root PHP file references ../config.php: $f"
              exit 1
            fi
          done

      - name: Secret/config guard
        shell: bash
        run: |
          set -euo pipefail
          test ! -f config.local.php
          test ! -f .env
          test ! -f php_check.php
